[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depthvla"
version = "0.1.0"
description = "SmolVLA with a frozen DeFM depth encoder fused element-wise into the RGB image tokens."
requires-python = ">=3.11"
# Core (episode format, recorder) is numpy + pillow only, so it can be installed into the Isaac Sim python env
# with `pip install --no-deps -e .`. The model / training stack is the `train` extra (see envs/setup_env.sh).
dependencies = ["numpy", "pillow", "pyyaml"]

[project.optional-dependencies]
train = [
    "torch>=2.7",
    "torchvision",
    "lerobot[smolvla]==0.6.1",
    "peft>=0.13",
    "omegaconf>=2.3",        # defm dependency (defm itself is installed with --no-deps, see envs/setup_env.sh)
    "huggingface-hub",
]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: needs lerobot + the SmolVLA / SmolVLM2 / DeFM weights (downloads on first run)",
]
